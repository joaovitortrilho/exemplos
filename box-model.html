<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            margin: 20px;
        }

        .content-box {
            background-color: lightblue;
            width: 200px;
            padding: 20px;
            border: 10px solid blue;
            box-sizing: content-box;
        }
        
    </style>
</head>
<body>
    
        <h1>Exemplo de box-level e inline-level</h1>
        <p>Paragrafo é box-level (quebra de linha automaticamente), mas os <a href="#">links são inline-level </a>
            (permanecem na mesma linha).</p>

        <h2>box-sizing: </h2>
        <div class="content-box">Content-box (padrão)</div>
        <div class="border-box">Border-box</div>
    

</body>
</html>
